###############################################################################
# Battery Alert Package
#
# Purpose:
#  - Detect numeric-low battery sensors by device class.
#  - Optionally include unknown and unavailable battery sensors.
#  - Expose the derived condition as binary_sensor.low_batteries.
#  - Send a daily warning through a runtime-selected Notify or Persistent path.
#
# Requires:
#  - `custom_templates/battery_alert.jinja`
#  - A valid notify action in `input_text.notifier_name` for Notify mode
#
# Per-entity opt-out attribute:
#  - `battery_alert_disabled: true`
#
# Documentation and dashboard examples:
#  - `packages/battery_alert.README.md`
###############################################################################

###############################################################################
# History
###############################################################################
# 3.0.0 (2026-08-23)
#  - Replaced the minute-polled old-style group with direct device-class selection
#  - Replaced the synchronized input boolean with a template binary sensor
#  - Replaced the minimum-threshold sentinel with an unavailable-sensor toggle
#  - Kept runtime Notify/Persistent selection and removed Slack support
#  - Removed the legacy MQTT deletion helper and automation
#  - Consolidated selection and message logic in a shared custom template
#
# 2.2.0 (2026-08-23)
#  - Formatted notification values with each entity's configured display precision
#  - Removed the unused legacy MQTT sensor creation automation
#  - Removed obsolete sensor-creation opt-out customizations
#  - Retained MQTT deletion support for cleanup of previously created sensors
#
# 2.1.0 (2026-04-20)
#  - Updated header/history to current package style
#  - Fixed float-aware threshold and MQTT value handling
#  - Reduced MQTT discovery collisions for non-sensor source entities
#  - Switched legacy hidden/data_template usage to current equivalents
#  - Added explicit automation ids for traces and UI editing
#
# 2.0.0 (2025-01-18)
#  - Major rewrite of automation logic and entity selection
#  - Consolidated battery checks and notifications into one automation
###############################################################################

###############################################################################
# Helpers
###############################################################################
input_boolean:
  battery_alert_include_unavailable:
    name: Include Unavailable Battery Sensors
    icon: mdi:battery-unknown

input_datetime:
  low_battery_notification_check:
    name: Low Battery Notification Check
    has_date: false
    has_time: true

input_number:
  battery_alert_threshold_max:
    name: Battery Alert Threshold
    icon: mdi:battery-alert
    mode: slider
    min: 1
    max: 100
    step: 1

input_select:
  notifier_format:
    name: Battery Alert Notification Type
    options:
      - Notify
      - Persistent
    icon: mdi:message-alert

input_text:
  notifier_name:
    name: Battery Alert Notify Action
    mode: text

###############################################################################
# Derived Status
###############################################################################
template:
  - binary_sensor:
      - name: Battery Attention Required
        default_entity_id: binary_sensor.low_batteries
        unique_id: battery_alert_low_batteries
        device_class: problem
        icon: >-
          {{ iif(this.state == 'on', 'mdi:battery-alert', 'mdi:battery-check') }}
        state: >-
          {% from 'battery_alert.jinja' import battery_alert_data %}
          {% set data = battery_alert_data(
            states('input_number.battery_alert_threshold_max') | float(15),
            is_state('input_boolean.battery_alert_include_unavailable', 'on')
          ) | from_json(default={}) %}
          {{ data.get('attention_count', 0) | int(0) > 0 }}
        attributes:
          threshold: >-
            {{ states('input_number.battery_alert_threshold_max') | float(15) }}
          include_unavailable: >-
            {{ is_state('input_boolean.battery_alert_include_unavailable', 'on') }}
          low_battery_entities: >-
            {% from 'battery_alert.jinja' import battery_alert_data %}
            {% set data = battery_alert_data(
              states('input_number.battery_alert_threshold_max') | float(15),
              is_state('input_boolean.battery_alert_include_unavailable', 'on')
            ) | from_json(default={}) %}
            {{ data.get('low', []) | map(attribute='entity_id') | list }}
          unavailable_battery_entities: >-
            {% from 'battery_alert.jinja' import battery_alert_data %}
            {% set data = battery_alert_data(
              states('input_number.battery_alert_threshold_max') | float(15),
              is_state('input_boolean.battery_alert_include_unavailable', 'on')
            ) | from_json(default={}) %}
            {{ data.get('unavailable', []) | map(attribute='entity_id') | list }}
          low_battery_count: >-
            {% from 'battery_alert.jinja' import battery_alert_data %}
            {% set data = battery_alert_data(
              states('input_number.battery_alert_threshold_max') | float(15),
              is_state('input_boolean.battery_alert_include_unavailable', 'on')
            ) | from_json(default={}) %}
            {{ data.get('low_count', 0) }}
          unavailable_battery_count: >-
            {% from 'battery_alert.jinja' import battery_alert_data %}
            {% set data = battery_alert_data(
              states('input_number.battery_alert_threshold_max') | float(15),
              is_state('input_boolean.battery_alert_include_unavailable', 'on')
            ) | from_json(default={}) %}
            {{ data.get('unavailable_count', 0) }}
          message: >-
            {% from 'battery_alert.jinja' import battery_alert_data, battery_alert_message %}
            {% set data = battery_alert_data(
              states('input_number.battery_alert_threshold_max') | float(15),
              is_state('input_boolean.battery_alert_include_unavailable', 'on')
            ) | from_json(default={}) %}
            {{ battery_alert_message(data) }}

###############################################################################
# Notification Automation
###############################################################################
automation:
  - id: battery_alert_notification
    alias: "Battery Alert: Notification"
    description: >-
      Sends the daily battery summary through the selected Notify or Persistent
      path, updates persistent notifications when alert details change, and
      clears tagged notifications when the condition resolves or routing changes.
    triggers:
      - trigger: time
        at: input_datetime.low_battery_notification_check
        id: daily_check
      - trigger: state
        entity_id: binary_sensor.low_batteries
        id: battery_status_changed
      - trigger: state
        entity_id: input_select.notifier_format
        id: notifier_format_changed
      - trigger: state
        entity_id: input_text.notifier_name
        id: notifier_name_changed
    actions:
      - variables:
          notification_tag: low_battery_alert
          notifier: >-
            {% set configured = states('input_text.notifier_name') | trim %}
            {{ configured if configured.startswith('notify.') else 'notify.teejay' }}
          previous_notifier: >-
            {% if trigger.id == 'notifier_name_changed'
                  and trigger.from_state is not none %}
              {% set configured = trigger.from_state.state | trim %}
              {{ configured if configured.startswith('notify.') else 'notify.teejay' }}
            {% else %}
              {{ notifier }}
            {% endif %}
          message_text: >-
            {{ state_attr('binary_sensor.low_batteries', 'message')
               | default('Battery attention is required.', true) }}
      - choose:
          - alias: Clear notifications when all monitored batteries are healthy
            conditions:
              - condition: trigger
                id: battery_status_changed
              - condition: template
                value_template: >-
                  {{ trigger.to_state is none or trigger.to_state.state != 'on' }}
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "{{ notification_tag }}"
              - action: "{{ notifier }}"
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"

          - alias: Move an active warning when the notification type changes
            conditions:
              - condition: trigger
                id: notifier_format_changed
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "{{ notification_tag }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ trigger.from_state is not none
                         and trigger.from_state.state in ['Default', 'Notify'] }}
                then:
                  - action: "{{ notifier }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notification_tag }}"
              - if:
                  - condition: state
                    entity_id: binary_sensor.low_batteries
                    state: "on"
                then:
                  - choose: &deliver_notification
                      - conditions:
                          - condition: state
                            entity_id: input_select.notifier_format
                            state: Notify
                        sequence:
                          - action: "{{ notifier }}"
                            data:
                              title: Low Battery Levels
                              message: "{{ message_text }}"
                              data:
                                group: battery
                                tag: "{{ notification_tag }}"
                      - conditions:
                          - condition: state
                            entity_id: input_select.notifier_format
                            state: Persistent
                        sequence:
                          - action: persistent_notification.create
                            data:
                              title: Low Battery Levels
                              notification_id: "{{ notification_tag }}"
                              message: "{{ message_text }}"

          - alias: Move an active Notify warning when its action changes
            conditions:
              - condition: trigger
                id: notifier_name_changed
            sequence:
              - action: "{{ previous_notifier }}"
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"
              - if:
                  - condition: state
                    entity_id: binary_sensor.low_batteries
                    state: "on"
                  - condition: state
                    entity_id: input_select.notifier_format
                    state: Notify
                then:
                  - action: "{{ notifier }}"
                    data:
                      title: Low Battery Levels
                      message: "{{ message_text }}"
                      data:
                        group: battery
                        tag: "{{ notification_tag }}"

          - alias: Keep an active persistent warning synchronized
            conditions:
              - condition: trigger
                id: battery_status_changed
              - condition: state
                entity_id: binary_sensor.low_batteries
                state: "on"
              - condition: state
                entity_id: input_select.notifier_format
                state: Persistent
            sequence:
              - action: persistent_notification.create
                data:
                  title: Low Battery Levels
                  notification_id: "{{ notification_tag }}"
                  message: "{{ message_text }}"

          - alias: Send the configured daily warning
            conditions:
              - condition: trigger
                id: daily_check
              - condition: state
                entity_id: binary_sensor.low_batteries
                state: "on"
            sequence:
              - choose: *deliver_notification
    mode: queued
    max: 10
