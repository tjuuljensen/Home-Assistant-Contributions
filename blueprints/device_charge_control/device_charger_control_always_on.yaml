# =============================================================================
# Device Charger Control - Always On
# device_charger_control_always_on.yaml
#
# Controls charging of an always-on device with a battery sensor using an
# attached power plug/switch.
#
# Author: Torsten Juul-Jensen <redacted>
#
# Changelog:
#   0.2.0 (2026-05-12)
#     Changed:
#       - Added queued execution with max 5.
#       - Added Home Assistant startup reconciliation.
#       - Changed battery thresholds to inclusive <= min and >= max.
#       - Added optional notification actions.
#       - Added switch/battery unavailable handling.
#       - Improved documentation and upgrade notes.
#
#   0.1.0 (2025-02-17)
#     Added:
#       - Initial version.
# =============================================================================

blueprint:
  name: Device Charge Control - for "always-on" devices
  domain: automation
  description: |
    ## Device Charge Control - for always-on devices

    Keeps a battery-powered device between two configurable charge thresholds by
    controlling a smart plug or switch.

    This version is intended for devices that normally stay connected to the same
    charger, for example wall-mounted tablets, hidden devices, battery-backed
    cameras, or laptops that are intentionally left plugged in.

    ### Requirements

    - A battery sensor that reports the battery percentage.
      Home Assistant Companion App battery sensors and externally updated sensors
      from scripts are both suitable.
    - A switch entity controlling the charger or power plug.

    ### Behavior

    The automation triggers when:

    - Home Assistant starts.
    - The battery sensor changes state.
    - The charger switch recovers from `unavailable` to `off`.

    The automation then:

    - Starts charging when battery is **less than or equal to** the minimum threshold.
    - Stops charging when battery is **greater than or equal to** the maximum threshold.
    - Does nothing while battery is between the thresholds.
    - Turns the charger on when the plug reconnects in `off` state.
    - Does not make battery-threshold decisions when the battery sensor is
      `unknown`, `unavailable`, or otherwise non-numeric.
    - Does not call switch services while the switch is `unknown` or `unavailable`.

    ### Resiliency notes

    - The automation uses `mode: queued` and `max: 5`, so short bursts of triggers
      are processed in order instead of cancelling in-flight runs.
    - Startup reconciliation means Home Assistant will correct the charger state
      after a restart without waiting for the next battery update.
    - Threshold comparisons are inclusive. A minimum of `20` starts charging at
      `20%` and below. A maximum of `80` stops charging at `80%` and above.
    - Optional notification actions can be used for abnormal conditions such as
      invalid battery state or unavailable switch state.

    ### Upgrade notes from older versions

    Existing automations created from an older version should be opened and saved
    once after updating the blueprint so Home Assistant can apply new optional
    inputs and defaults.

    Important behavior changes:

    - Run mode changed from `restart` to `queued`.
    - Battery threshold handling changed from strict `below`/`above` to inclusive
      `<= minimum` and `>= maximum`.
    - Home Assistant startup now re-evaluates the current state.
    - Invalid battery states no longer globally block plug-reconnect recovery.
    - Switch `unknown`/`unavailable` states are now detected before service calls.
    - Optional notification actions were added.

    Example notification action:

    ```yaml
    - action: persistent_notification.create
      data:
        title: "{{ notification_title }}"
        message: "{{ notification_message }}"
    ```

    ### Example use cases

    - Keep a wall-mounted tablet between 20% and 80%.
    - Keep a hidden device powered without permanently holding the battery at 100%.
    - Recover safely after a smart plug, Zigbee, Z-Wave, or Wi-Fi outage.

    ### Related version

    A separate blueprint is available for devices that are physically plugged in
    and unplugged, such as laptops and phones that move around.

    ### Useful links

    - [PowerShell script](https://raw.githubusercontent.com/tjuuljensen/Home-Assistant-Contributions/refs/heads/main/blueprints/device_charge_control/scripts/Send-LaptopBatteryStatus.ps1)
    to send battery state information from a Windows computer to Home Assistant.

    - [Bash script](https://raw.githubusercontent.com/tjuuljensen/Home-Assistant-Contributions/refs/heads/main/blueprints/device_charge_control/scripts/send_laptop_battery_status.sh)
    to send battery state information from a Linux computer to Home Assistant.

    - [Another version](https://raw.githubusercontent.com/tjuuljensen/Home-Assistant-Contributions/refs/heads/main/blueprints/device_charge_control/device_charger_control_always_on.yaml)
    of this blueprint - for **always on** devices.


    ## Blueprint configuration

    Please select your battery sensor, your device tracker and your switch below:
    
  input:
    battery_sensor:
      name: Battery Sensor
      description: Battery percentage sensor for the device being protected.
      selector:
        entity:
          filter:
            - device_class:
                - battery
              domain:
                - sensor
          multiple: false

    power_switch:
      name: Device Power Switch
      description: The switch that controls charger power delivery, such as a smart plug.
      selector:
        entity:
          filter:
            - domain:
                - switch
          multiple: false

    threshold_configuration:
      name: Threshold configuration
      icon: mdi:battery-medium
      description: Battery thresholds used to control charging.
      input:
        battery_charge_min:
          name: Start charging when battery percentage is at or below
          selector:
            number:
              min: 1.0
              max: 49.0
              step: 1.0
              mode: slider
              unit_of_measurement: "%"
          default: 20

        battery_charge_max:
          name: Stop charging when battery percentage is at or above
          selector:
            number:
              min: 50.0
              max: 100.0
              step: 1.0
              mode: slider
              unit_of_measurement: "%"
          default: 80

    notification_options:
      name: Notification options
      icon: mdi:bell-outline
      collapsed: true
      description: Optional actions to run when the automation detects an abnormal condition.
      input:
        notification_actions:
          name: Notification actions
          description: >
            Optional actions for abnormal states. These actions can use the variables
            `notification_title` and `notification_message`.
          default: []
          selector:
            action: {}

  source_url: https://raw.githubusercontent.com/tjuuljensen/Home-Assistant-Contributions/refs/heads/main/blueprints/device_charge_control/device_charger_control_always_on.yaml

triggers:
  - alias: Reconcile charger state when Home Assistant starts
    trigger: homeassistant
    event: start
    id: ha_started

  - alias: Reconcile charger state when battery sensor changes
    trigger: state
    entity_id: !input battery_sensor
    for:
      seconds: 10
    id: battery_state_change

  - alias: Recover charging if the plug reconnects in off state
    trigger: state
    entity_id: !input power_switch
    from: unavailable
    to: "off"
    id: plug_reconnects_in_state_off

actions:
  - variables:
      battery_entity: !input battery_sensor
      switch_entity: !input power_switch
      battery_charge_min: !input battery_charge_min
      battery_charge_max: !input battery_charge_max
      battery_level: "{{ states(battery_entity) | float(none) }}"
      battery_valid: "{{ battery_level is number }}"
      switch_state: "{{ states(switch_entity) }}"
      switch_available: "{{ switch_state not in ['unknown', 'unavailable', 'none'] }}"

  - choose:
      - alias: Switch is unavailable; do not call switch services
        conditions:
          - condition: template
            value_template: "{{ not switch_available }}"
        sequence:
          - variables:
              notification_title: "Device charger switch unavailable"
              notification_message: >-
                {{ switch_entity }} is {{ switch_state }}. Charger control was skipped.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ true }}"
                sequence: !input notification_actions
          - stop: Charger switch is unavailable or unknown.

      - alias: Battery sensor is invalid on a battery/startup reconciliation trigger
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['battery_state_change', 'ha_started'] }}"
          - condition: template
            value_template: "{{ not battery_valid }}"
        sequence:
          - variables:
              notification_title: "Device battery sensor unavailable"
              notification_message: >-
                {{ battery_entity }} is {{ states(battery_entity) }}. Battery-threshold
                charging decision was skipped.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ true }}"
                sequence: !input notification_actions
          - stop: Battery state is not numeric.

      - alias: Charger plug reconnected in off state; turn charger on defensively
        conditions:
          - condition: trigger
            id: plug_reconnects_in_state_off
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input power_switch

      - alias: Battery is at or below the minimum threshold; start charging
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['battery_state_change', 'ha_started'] }}"
          - condition: template
            value_template: "{{ battery_valid and battery_level <= (battery_charge_min | float) }}"
          - condition: template
            value_template: "{{ switch_state == 'off' }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input power_switch

      - alias: Battery is at or above the maximum threshold; stop charging
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['battery_state_change', 'ha_started'] }}"
          - condition: template
            value_template: "{{ battery_valid and battery_level >= (battery_charge_max | float) }}"
          - condition: template
            value_template: "{{ switch_state == 'on' }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input power_switch

mode: queued
max: 5
